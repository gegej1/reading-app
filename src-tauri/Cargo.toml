[package]
name = "dise"
version = "0.1.0"
description = "Desktop shell for 底色 (Dise)"
authors = ["gegej1"]
edition = "2021"
# tauri 2.12 requires Rust 1.90. Together with resolver "3" this also keeps
# `cargo update` on dependency versions that still build with that toolchain.
rust-version = "1.90"
resolver = "3"
publish = false

[lib]
# Named differently from the binary so the two build outputs never collide.
name = "dise_lib"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
# "tray-icon": the menu-bar icon. "macos-private-api": the capture window is
# transparent (a rounded paper slip), which needs `macOSPrivateApi` in
# tauri.conf.json and this feature.
tauri = { version = "2.12.3", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Log to stdout and ~/Library/Logs/com.gegej1.dise/ (see src/logging.rs).
tauri-plugin-log = "2.10.1"
log = "0.4"
# Local timestamps in log lines (already used by tauri-plugin-log).
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
# A second launch focuses the running app.
tauri-plugin-single-instance = "2.5.3"
# Opens http(s) links in the default browser.
tauri-plugin-opener = "2.7.1"
# The system-wide shortcut that shows the capture window.
tauri-plugin-global-shortcut = "2.4.1"
# setsid/kill for the login-shell capture (see src/shell_env.rs) and for git
# commands that run under a timeout (see src/kb/git.rs).
libc = "0.2"

# Which app was in front before the capture window opened, to hand the focus
# back when it closes (see src/capture_window.rs). Already part of the build
# through tao and tauri-plugin-opener; only the "libc" feature is added.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "libc",
  "NSRunningApplication",
  "NSWorkspace",
] }

[dev-dependencies]
# `tauri::test` (mock runtime + IPC helpers) for the command tests. Dev-only:
# with resolver 2+ this feature is not enabled in normal builds.
tauri = { version = "2.12.3", features = ["tray-icon", "macos-private-api", "test"] }
